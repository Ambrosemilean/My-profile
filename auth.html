<!DOCTYPE html>
<html>
    <head>
        <title>My Simple Authentication App</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                background: #f4f4f4;
                text-align: center;
            }
            .container{
                background: white;
                padding: 20px;
                margin: 40px auto;
                width: 300px;
                border-radius: 10px 0;
            }
            input{
                width: 90%;
                padding: 10px;
                margin: 10px auto;
            }
            button{
                padding: 10px;
                width: 100%;
                background: blue;
                color: white;
                border: none;
                cursor: pointer;
            }
            .hidden{
                display: none;
            }
        </style>
    </head>
    <body>
        <!--LANDING PAGE-->
        <div id="landing" class="cointainer">
            <h1>Welcome</h1>
            <p>Your journey starts here</p>
            <button onclick="showPage('signup')">Sign up</button>
            <button onclick="showPage('login')">Login</button>
            </div>

            <!--SIGNUP PAGE-->
            <div id="signup" class="container hidden">
                <h2>Sign Up</h2>
                <input type="text" id="signupUsername" placeholder="Username">
                <input type="text" id="signuPassword" placeholder="Password">
                <button onclick="signup()">Create Account</button>
                <p onclick="showPage('login')">Already have an account? Login</p>
            </div>

            <!--LOGIN PAGE-->
            <div id="login" class="container hidden">
                <h2>Login</h2>
                <input type="text" id="loginUser" placeholder="Username">
                <input type="password" id="loginPassword" placeholder="Password">
                <button onclick="login()">Login</button>
                <p onclick="showPage('signup')">Don't have an account? Sign Up</p>
            </div>
