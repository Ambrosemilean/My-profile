<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: rgb(65, 7, 239);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: rgb(234, 232, 239);
            width: 300px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 5px 15px rgba(red, green, blue, alpha);
            text-align: center;
        }
        .card img {
            width: 100px;
            height: 100x;
            border-radius: 50px;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid rgb(38, 14, 251);
        }

        .card h2 {
            margin: 10px 0 5px;
            font-size: 20px;
        }

        .card p.position {
            color: #777;
            margin-bottom: 15px;
        }

        .details {
            margin-top: 10px;
            text-align: center;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
            color: blue;
            outline:none;
        }

        details p {
            margin: 8px 0;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
 <div class="card">
    <img src="Ambrose.jpg" alt="Ambrose Image">
    <h2> Uwakwe Ambrose Ikenna</h2>
    <p class="Position"><b>Fullstack Developer</b></p>
    <details>
        <summary>View Details</summary>
        <p><strong>Email:</strong>ikennaambrose60@gmail.com</p>
        <p><strong>Phone:</strong>09067037543</p>
        <p><strong>Linkedin:</strong>https//www.linkedin.com/in/uwakwe-ambrose</p>
    </details>
 </div>  
</body>
</html>
